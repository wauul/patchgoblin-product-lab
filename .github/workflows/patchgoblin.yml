name: PatchGoblin CI
on:
  push: {}
  pull_request: {}
permissions:
  contents: read
jobs:
  pg_2629410778:
    name: . · node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: npm run test
      run: npm run test
    - name: npm run lint
      run: npm run lint
    - name: npm run build
      run: npm run build
